<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ambil foto ChibiBooth langsung dari kamera browser.">
  <title>Ambil Foto | ChibiBooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/booth.css">
  <script defer src="js/main.js"></script>
  <script defer src="js/camera.js"></script>
</head>
<body class="booth-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ChibiBooth home">
      <span class="brand-mark">♡</span>
      <span>ChibiBooth</span>
    </a>
    <nav class="header-actions" aria-label="Navigasi kamera">
      <a href="index.html">Home</a>
      <button class="theme-toggle" type="button" data-theme-toggle>Pastel Mode</button>
    </nav>
  </header>

  <main class="booth-shell">
    <section class="camera-card">
      <div class="camera-heading">
        <p class="eyebrow">kamera booth</p>
        <h1>Siap cekrek?</h1>
        <p>Atur timer, jumlah foto, lalu pose paling gemoy.</p>
      </div>

      <div class="camera-stage" id="cameraStage">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <div class="camera-placeholder" id="cameraPlaceholder">
          Kamera belum aktif.
        </div>
        <div class="countdown" id="countdown" aria-live="assertive"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>
      </div>

      <p class="camera-status" id="cameraStatus" role="status">
        Tap Aktifkan Kamera. Di HP, izin kamera hanya muncul jika halaman dibuka lewat HTTPS.
      </p>

      <div class="booth-controls">
        <label>
          Timer
          <select id="timerSelect">
            <option value="3">3 detik</option>
            <option value="5">5 detik</option>
            <option value="10">10 detik</option>
          </select>
        </label>
        <label>
          Jumlah foto
          <select id="photoCountSelect">
            <option value="1">1 foto</option>
            <option value="2">2 foto</option>
            <option value="3">3 foto</option>
            <option value="4" selected>4 foto</option>
          </select>
        </label>
      </div>

      <div class="booth-actions">
        <button class="button button-primary" type="button" id="enableCameraButton">Aktifkan Kamera</button>
        <button class="button button-secondary" type="button" id="captureButton">Ambil Foto</button>
        <button class="button button-secondary" type="button" id="switchCameraButton">Ganti Kamera</button>
        <button class="button button-soft" type="button" id="retakeButton">Ulangi</button>
      </div>

      <div class="mini-actions">
        <label class="toggle-row">
          <input type="checkbox" id="mirrorToggle" checked>
          <span>Mirror selfie mode</span>
        </label>
        <button class="text-button" type="button" id="fullscreenButton">Fullscreen camera</button>
      </div>
    </section>
  </main>
</body>
</html>
